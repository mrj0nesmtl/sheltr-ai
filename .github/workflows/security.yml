name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  # Explicitly deny dangerous permissions
  actions: none
  id-token: none
  packages: none

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'apps/web/package-lock.json'
        
    - name: Install dependencies
      run: |
        cd apps/web
        npm ci
        
    - name: Run npm audit
      continue-on-error: true
      run: |
        cd apps/web
        npm audit --audit-level=high || echo "⚠️ npm audit found issues (non-blocking)"
        
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        cd apps/api
        pip install -r requirements.txt
        
    - name: Run safety check
      continue-on-error: true
      run: |
        pip install safety
        cd apps/api
        safety check

# CodeQL analysis is handled by dedicated .github/workflows/codeql.yml
# This prevents duplicate CodeQL runs and configuration conflicts
# The upload-sarif actions below are for OTHER security tools (Trivy, Checkov), NOT CodeQL

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch full history for TruffleHog
      
    - name: Run TruffleHog
      uses: trufflesecurity/trufflehog@main
      continue-on-error: true  # Don't fail the build on secrets found
      with:
        path: ./
        base: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        head: HEAD
        extra_args: --only-verified
        
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Check if Dockerfile exists
      id: check-dockerfile
      run: |
        if [ -f "Dockerfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ No Dockerfile found - skipping Docker security scan"
        fi
        
    - name: Build Docker image
      if: steps.check-dockerfile.outputs.exists == 'true'
      continue-on-error: true
      run: |
        docker build -t sheltr-security-scan:latest -f Dockerfile .
        
    - name: Run Trivy vulnerability scanner
      if: steps.check-dockerfile.outputs.exists == 'true'
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: 'sheltr-security-scan:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'  # Only report high/critical
        
    - name: Upload Trivy scan results to GitHub Security tab
      if: steps.check-dockerfile.outputs.exists == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-results'

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '18'
        
    - name: Install license checker
      run: npm install -g license-checker
      
    - name: Check frontend licenses
      run: |
        cd apps/web
        npm ci
        license-checker --summary
        
    - name: Check for prohibited licenses
      continue-on-error: true
      run: |
        cd apps/web
        license-checker --excludePackages "dev-package@0.0.0" --restrict "GPL;AGPL;LGPL;CPAL;OSL;EPL;CPOL" --summary

  infrastructure-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Run Checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: dockerfile,github_actions
        output_format: sarif
        output_file_path: checkov-results.sarif
        quiet: true
        soft_fail: true
        
    - name: Upload Checkov scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: checkov-results.sarif
        category: 'checkov-results'

  security-policy-check:
    name: Security Policy Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Validate SECURITY.md exists
      run: |
        if [ ! -f "SECURITY.md" ]; then
          echo "❌ SECURITY.md file is missing"
          exit 1
        fi
        echo "✅ SECURITY.md file found"
        
    - name: Check for security best practices
      run: |
        echo "🔍 Checking security configurations..."
        
        # Check for common security files
        files=(".github/dependabot.yml" ".github/workflows/security.yml" ".gitignore")
        for file in "${files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "⚠️  $file is missing"
          fi
        done
        
        # Check for sensitive files that shouldn't be committed
        sensitive_patterns=("*.key" "*.pem" ".env" "*.p12" "*.pfx")
        echo "🔍 Checking for sensitive files..."
        for pattern in "${sensitive_patterns[@]}"; do
          if find . -name "$pattern" -not -path "./.git/*" | grep -q .; then
            echo "❌ Found potential sensitive files matching $pattern"
            find . -name "$pattern" -not -path "./.git/*"
            exit 1
          fi
        done
        echo "✅ No sensitive files found in repository"

  notification:
    name: Security Notification
    runs-on: ubuntu-latest
    needs: [dependency-scan, secrets-scan, docker-security, license-compliance, infrastructure-scan, security-policy-check]
    if: failure()
    
    steps:
    - name: Send security alert
      run: |
        echo "🚨 Security scan failed! Check the workflow results."
        echo "Security issues detected in SHELTR repository."
        # In production, this would send alerts to security team
